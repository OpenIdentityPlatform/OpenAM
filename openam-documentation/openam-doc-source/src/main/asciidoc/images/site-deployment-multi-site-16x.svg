  <text x="758.0" y="76.0" text-anchor="middle" font-size="18" font-weight="400">Local site URL and nodes</text>
  <path d="M34 55 H15 V366" fill="none" stroke="#38536d" stroke-width="2.2"/>
  <path d="M926 55 H945 V366" fill="none" stroke="#38536d" stroke-width="2.2"/>
  <rect x="34" y="132" width="336" height="60" rx="8" fill="#e5f4ee" stroke="#38536d" stroke-width="1.6"/>
  <text x="202.0" y="160.0" text-anchor="middle" font-size="21" font-weight="700">Configuration</text>
  <text x="202.0" y="183.0" text-anchor="middle" font-size="18" font-weight="400">Settings and policies</text>
  <rect x="590" y="132" width="336" height="60" rx="8" fill="#e5f4ee" stroke="#38536d" stroke-width="1.6"/>
  <text x="758.0" y="160.0" text-anchor="middle" font-size="21" font-weight="700">Configuration</text>
