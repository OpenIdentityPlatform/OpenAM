  <path d="M377 150 H583" fill="none" stroke="#38536d" stroke-width="2.2" marker-end="url(#arrow)" marker-start="url(#arrow-back)" stroke-dasharray="7 5"/>
  <text x="480" y="181" text-anchor="middle" font-size="17" font-weight="400">Data replication</text>
  <rect x="34" y="234" width="336" height="60" rx="8" fill="#e5f4ee" stroke="#38536d" stroke-width="1.6"/>
  <text x="202.0" y="262.0" text-anchor="middle" font-size="21" font-weight="700">CTS</text>
