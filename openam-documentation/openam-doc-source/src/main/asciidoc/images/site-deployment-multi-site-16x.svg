    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#38536d"/>
    </marker>
    <marker id="arrow-back" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M10 0 L0 5 L10 10 Z" fill="#38536d"/>
    </marker>
  </defs>
  <rect width="960" height="452" fill="#fff"/>
  <g font-family="DejaVu Sans, sans-serif" fill="#152b43">
  <rect x="34" y="20" width="336" height="70" rx="8" fill="#e7f2fc" stroke="#38536d" stroke-width="1.6"/>
  <text x="202.0" y="53.0" text-anchor="middle" font-size="21" font-weight="700">OpenAM · site A</text>
  <text x="202.0" y="76.0" text-anchor="middle" font-size="18" font-weight="400">Local site URL and nodes</text>
