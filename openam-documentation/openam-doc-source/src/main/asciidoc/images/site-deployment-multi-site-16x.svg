  <path d="M377 354 H583" fill="none" stroke="#38536d" stroke-width="2.2" marker-end="url(#arrow)" marker-start="url(#arrow-back)" stroke-dasharray="7 5"/>
  <text x="480" y="385" text-anchor="middle" font-size="17" font-weight="400">Data replication</text>
  <text x="480" y="429" text-anchor="middle" font-size="19" font-weight="400">Configure and monitor each replication path for your topology.</text>
