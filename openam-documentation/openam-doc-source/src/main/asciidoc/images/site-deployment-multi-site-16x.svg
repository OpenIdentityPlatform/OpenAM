<svg xmlns="http://www.w3.org/2000/svg" width="960" height="452" viewBox="0 0 960 452" role="img" aria-labelledby="title description">
  <title id="title">Two sites with separate data replication paths</title>
  <desc id="description">OpenAM uses its site&#x27;s data store connections. Configuration, CTS, and identity each have a separate inter-site replication path.</desc>
