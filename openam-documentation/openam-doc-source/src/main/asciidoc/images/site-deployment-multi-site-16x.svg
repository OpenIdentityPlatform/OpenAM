  <path d="M945 264 H926" fill="none" stroke="#38536d" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M377 252 H583" fill="none" stroke="#38536d" stroke-width="2.2" marker-end="url(#arrow)" marker-start="url(#arrow-back)" stroke-dasharray="7 5"/>
  <text x="480" y="283" text-anchor="middle" font-size="17" font-weight="400">Data replication</text>
