  <rect x="27" y="275" width="280" height="78" rx="8" fill="#e5f4ee" stroke="#38536d" stroke-width="1.6"/>
  <text x="167.0" y="312.0" text-anchor="middle" font-size="21" font-weight="700">Configuration</text>
  <text x="167.0" y="335.0" text-anchor="middle" font-size="18" font-weight="400">External store and replicas</text>
  <rect x="340" y="275" width="280" height="78" rx="8" fill="#e5f4ee" stroke="#38536d" stroke-width="1.6"/>
  <text x="480.0" y="312.0" text-anchor="middle" font-size="21" font-weight="700">Core Token Service</text>
  <text x="480.0" y="335.0" text-anchor="middle" font-size="18" font-weight="400">External store and replicas</text>
  <rect x="653" y="275" width="280" height="78" rx="8" fill="#e5f4ee" stroke="#38536d" stroke-width="1.6"/>
