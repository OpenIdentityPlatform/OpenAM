<svg xmlns="http://www.w3.org/2000/svg" width="960" height="412" viewBox="0 0 960 412" role="img" aria-labelledby="title description">
  <title id="title">OpenAM site with three external stores</title>
  <desc id="description">Two nodes in one OpenAM site connect to separate external configuration, CTS, and identity stores.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#38536d"/>
    </marker>
    <marker id="arrow-back" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M10 0 L0 5 L10 10 Z" fill="#38536d"/>
    </marker>
  </defs>
  <rect width="960" height="412" fill="#fff"/>
  <g font-family="DejaVu Sans, sans-serif" fill="#152b43">
  <rect x="300" y="18" width="360" height="64" rx="8" fill="#e7f2fc" stroke="#38536d" stroke-width="1.6"/>
  <text x="480.0" y="57.0" text-anchor="middle" font-size="21" font-weight="700">Site HTTPS load balancer</text>
  <path d="M480 82 V104 H236 V132" fill="none" stroke="#38536d" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M480 104 H724 V132" fill="none" stroke="#38536d" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="64" y="132" width="344" height="62" rx="8" fill="#e7f2fc" stroke="#38536d" stroke-width="1.6"/>
  <text x="236.0" y="170.0" text-anchor="middle" font-size="21" font-weight="700">OpenAM node 1</text>
  <rect x="552" y="132" width="344" height="62" rx="8" fill="#e7f2fc" stroke="#38536d" stroke-width="1.6"/>
  <text x="724.0" y="170.0" text-anchor="middle" font-size="21" font-weight="700">OpenAM node 2</text>
  <path d="M236 194 V223 H724 V194" fill="none" stroke="#38536d" stroke-width="2.2"/>
  <path d="M480 223 V248" fill="none" stroke="#38536d" stroke-width="2.2"/>
  <path d="M167 248 H793" fill="none" stroke="#38536d" stroke-width="2.2"/>
  <path d="M167 248 V275" fill="none" stroke="#38536d" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M480 248 V275" fill="none" stroke="#38536d" stroke-width="2.2" marker-end="url(#arrow)"/>
