      <path d="M10 0 L0 5 L10 10 Z" fill="#38536d"/>
    </marker>
  </defs>
  <rect width="960" height="534" fill="#fff"/>
  <g font-family="DejaVu Sans, sans-serif" fill="#152b43">
  <rect x="295" y="18" width="370" height="64" rx="8" fill="#e7f2fc" stroke="#38536d" stroke-width="1.6"/>
  <text x="480.0" y="57.0" text-anchor="middle" font-size="21" font-weight="700">Browsers and client applications</text>
