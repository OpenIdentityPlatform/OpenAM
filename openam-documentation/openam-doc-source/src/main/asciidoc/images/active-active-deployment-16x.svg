<svg xmlns="http://www.w3.org/2000/svg" width="960" height="534" viewBox="0 0 960 534" role="img" aria-labelledby="title description">
  <title id="title">Two-site OpenAM deployment</title>
  <desc id="description">Public clients reach either site through global routing. Each site has HTTPS ingress, OpenAM nodes, protected applications, and data store connections.</desc>
