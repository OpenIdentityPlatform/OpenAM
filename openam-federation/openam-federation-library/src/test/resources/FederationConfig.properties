com.sun.identity.saml.xmlsig.keystore=${project.build.testOutputDirectory}/keystore.jks
com.sun.identity.saml.xmlsig.storetype=JKS
com.sun.identity.saml.xmlsig.storepass=${project.build.testOutputDirectory}/keystorepass
com.sun.identity.saml.xmlsig.keypass=${project.build.testOutputDirectory}/keystorepass

# The platform configuration plugin SystemConfigurationUtil looks up. Set here rather than from a
# test method because ConfigurationManager reads it once into a static field at class load, and
# surefire runs the whole module in one JVM: a test that sets it in its own body only works while
# that test class runs alone. See StubPlatformConfiguration.
com.sun.identity.plugin.configuration.class=com.sun.identity.federation.common.StubPlatformConfiguration
