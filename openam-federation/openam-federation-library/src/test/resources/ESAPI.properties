# Minimal ESAPI configuration for the unit tests of this module.
#
# OpenAM ships the real configuration in openam-core (src/main/resources/ESAPI.properties), which
# reaches the classpath of the deployed webapp and of the fedlet WAR, but not the test classpath of
# this library. ESAPI refuses to start without an ESAPI.properties it can load, so tests covering
# ESAPI-based encoding need this file. Only the encoder settings matter here and they mirror the
# ones in openam-core; logging goes to JUL to avoid pulling an slf4j binding into the tests.
#
# NOTE this directory is declared with <filtering>true</filtering> in pom.xml, which the neighbouring
# FederationConfig.properties depends on, so a '${...}' in any value below would be substituted by
# Maven before ESAPI ever sees it. Keep the values here literal.
ESAPI.Encoder=org.owasp.esapi.reference.DefaultEncoder
ESAPI.Logger=org.owasp.esapi.logging.java.JavaLogFactory
ESAPI.printProperties=false

Encoder.AllowMultipleEncoding=false
Encoder.AllowMixedEncoding=false
Encoder.DefaultCodecList=HTMLEntityCodec,PercentCodec,JavaScriptCodec

Logger.ApplicationName=OpenAM
Logger.LogApplicationName=false
Logger.LogServerIP=false
Logger.LogEncodingRequired=false
Logger.UserInfo=false
Logger.ClientInfo=false
# Read with getBooleanProp, so it takes true/false and not a prefix string. Absent - or holding
# anything else - JavaLogFactory's static initialiser prints a ConfigurationException to stdout that
# reads like a test failure in the surefire output. true is the value the factory falls back to.
Logger.LogPrefix=true
