#
# The Open Federation Library reads its settings from this bundle. It is test scope only: the
# library ships no FederationConfig.properties of its own, so nothing is being shadowed here.
#
# The platform configuration plugin SystemConfigurationUtil looks up. Set here rather than from a
# test method because ConfigurationManager reads it once into a static field at class load, and
# surefire runs the whole module in one JVM: a test that sets it in its own body only works while
# that test class runs alone. See StubPlatformConfiguration.
com.sun.identity.plugin.configuration.class=org.forgerock.openam.authentication.modules.saml2.StubPlatformConfiguration
